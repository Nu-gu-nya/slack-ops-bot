name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major as local development; --env-file and the node:test glob need 22+.
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Catches a broken Dockerfile before a deploy does. The image is built, not pushed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag slack-ops-bot:ci .
      - name: Image contains the compiled entry point and no tests
        run: |
          docker run --rm --entrypoint sh slack-ops-bot:ci -c '
            test -f dist/bot/app.js &&
            ! find dist -name "*.spec.js" | grep -q . &&
            test "$(whoami)" = node'
