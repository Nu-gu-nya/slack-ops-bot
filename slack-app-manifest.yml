# Slack 앱 설정 (api.slack.com/apps → Create New App → From a manifest 에 붙여넣기)
# 근거: docs/ARCHITECTURE.md "Slack 앱 설정" 표
display_information:
  name: Ops Bot
features:
  bot_user:
    display_name: Ops Bot
    always_online: true
  slash_commands:
    - command: /report
      description: 업무 보고 작성
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - reactions:write
      - commands
settings:
  event_subscriptions:
    bot_events:
      - message.channels
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
